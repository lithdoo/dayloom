name: Archive Protocol

on:
  push:
    paths:
      - 'packages/archive-protocol/**'
      - 'fixtures/archive-protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/archive-protocol.yml'
  pull_request:
    paths:
      - 'packages/archive-protocol/**'
      - 'fixtures/archive-protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/archive-protocol.yml'

jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -w @dayloom/archive-protocol
