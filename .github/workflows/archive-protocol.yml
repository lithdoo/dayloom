name: Archive Protocol

on:
  push:
    paths:
      - 'packages/archive-protocol/**'
      - 'fixtures/archive-protocol/**'
      - 'examples/**'
      - 'scripts/check-examples.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - '.github/workflows/archive-protocol.yml'
  pull_request:
    paths:
      - 'packages/archive-protocol/**'
      - 'fixtures/archive-protocol/**'
      - 'examples/**'
      - 'scripts/check-examples.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - '.github/workflows/archive-protocol.yml'

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run examples:check
      - if: runner.os == 'Linux'
        run: bash -n examples/dayloom-tui/open-world.sh

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -w @dayloom/archive-protocol
