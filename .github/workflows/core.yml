name: Core

on:
  push:
    paths:
      - 'packages/core/**'
      - 'packages/archive-protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/archive-protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/core.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @dayloom/archive-protocol
      - run: npm test -w @dayloom/core

  packed-platform:
    name: Packed retrieval (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @dayloom/archive-protocol
      - run: npm run build -w @dayloom/core
      - run: node --test packages/core/test/archive-retrieval.test.js
      - run: npm run test:pack -w @dayloom/core
