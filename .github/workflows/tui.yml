name: TUI

on:
  push:
    paths:
      - 'packages/tui/**'
      - 'packages/core2/**'
      - 'packages/archive-protocol/**'
      - 'examples/dayloom-tui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tui.yml'
  pull_request:
    paths:
      - 'packages/tui/**'
      - 'packages/core2/**'
      - 'packages/archive-protocol/**'
      - 'examples/dayloom-tui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tui.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @dayloom/archive-protocol
      - run: npm test -w @dayloom/core2
      - run: npm test -w @dayloom/tui
      - run: npm run examples:check

  required-pty:
    runs-on: ubuntu-latest
    env:
      DAYLOOM_TUI_REQUIRE_PTY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @dayloom/archive-protocol
      - run: npm test -w @dayloom/core2
      - run: npm test -w @dayloom/tui
      - run: bash -n examples/dayloom-tui/open-world.sh examples/dayloom-tui/scripts/ensure-dayloom.sh
      - run: npm run examples:check
