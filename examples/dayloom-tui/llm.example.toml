# Promptpile caller configuration matching the previous .env defaults.
# Export DEEPSEEK_API_KEY before starting Dayloom. Do not put the secret here.

[[llm_api]]
name = "deepseek"
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

[promptpile]
llm_api = "deepseek"
